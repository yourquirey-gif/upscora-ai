name: Build UPSCora AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/upscora
          MONGODB_DB: upscora
          AUTH_SECRET: ci-only-upscora-secret-change-me
          OPENROUTER_API_KEY: ci-placeholder
          OPENROUTER_MODEL: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
